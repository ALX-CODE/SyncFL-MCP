changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: New capabilities
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation and setup
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other improvements
      labels:
        - "*"
