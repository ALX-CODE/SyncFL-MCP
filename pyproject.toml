[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-studio-mcp"
version = "0.2.0"
description = "SyncFL: local MCP tools for precise FL Studio control, composition, mixing, and verified audio workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "nobibasedd" }, { name = "ALX-CODE" }]
maintainers = [{ name = "nobibasedd" }, { name = "ALX-CODE" }]
keywords = ["mcp", "fl-studio", "midi", "daw", "music-production", "piano-roll"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "fastmcp>=3.4.7,<4",
    # Security floor applies to pip installs as well as the locked uv environment.
    "cryptography>=50.0.2",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0; sys_platform != 'win32'",
    "pynput>=1.7",
]

[project.urls]
Repository = "https://github.com/ALX-CODE/SyncFL-MCP"
Documentation = "https://github.com/ALX-CODE/SyncFL-MCP/blob/main/docs/README.md"
Issues = "https://github.com/ALX-CODE/SyncFL-MCP/issues"

[project.optional-dependencies]
key = ["numpy>=2"]
serum = ["zstandard>=0.25,<1", "cbor2>=6,<7"]
audio = ["numpy>=2", "scipy>=1.14", "soundfile>=0.13", "pillow>=11", "PyAudioWPatch>=0.2.12.8; sys_platform == 'win32'"]
dev = [
    "hatchling>=1.27,<2",
    "fl-studio-api-stubs>=37.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
syncfl-mcp = "fl_studio_mcp.server:main"
fl-studio-mcp = "fl_studio_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"native/midi_bridge/runtime" = "fl_studio_mcp/_native/midi_bridge"
"native/background_bridge/runtime" = "fl_studio_mcp/_native/background_bridge"
"native/midi_transport/runtime" = "fl_studio_mcp/_native/midi_transport"
"native/audio_tempo/runtime" = "fl_studio_mcp/_native/audio_tempo"

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "fl-studio-api-stubs>=37.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
